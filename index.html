<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="theme-color" content="#ff6b8a" />

        <!--
            Pretendard 동적 서브셋. 앱 CSS와 따로 두어 배포마다 다시 받지 않고,
            unicode-range로 실제 쓰인 글자가 든 조각만 내려받는다.
        -->
        <link rel="stylesheet" href="/fonts/pretendard.css" />

        <!--
            Microsoft Clarity + Google Analytics.
            내 방문은 세지 않는다: 로컬 개발 서버와 Vercel 미리보기 배포에서는
            아예 불러오지 않고, 그 밖의 브라우저는 ?analytics=off 로 끌 수 있다
            (?analytics=on 로 되돌린다).
        -->
        <script>
            (function () {
                var host = location.hostname;
                var isLocal =
                    host === "localhost" ||
                    host === "127.0.0.1" ||
                    host === "" ||
                    host.endsWith(".local") ||
                    /^(192\.168|10)\./.test(host);
                // 운영은 portfolio-site-xi-virid, 나머지 vercel.app은 미리보기 배포다
                var isPreview =
                    host.endsWith(".vercel.app") &&
                    host !== "portfolio-site-xi-virid.vercel.app";

                var off = false;
                try {
                    var choice = new URLSearchParams(location.search).get(
                        "analytics",
                    );
                    if (choice === "off")
                        localStorage.setItem("analytics-off", "1");
                    if (choice === "on") localStorage.removeItem("analytics-off");
                    off = localStorage.getItem("analytics-off") === "1";
                } catch (error) {
                    // 저장소를 막아 둔 브라우저. 기본값(수집)으로 둔다
                }

                if (isLocal || isPreview || off) return;

                // 실제로 붙일 때만 미리 연결해 둔다. 스크립트가 뒤늦게
                // 꼬리를 물고 붙는 구조라 연결 시간이 그대로 지연이 된다
                [
                    "https://www.clarity.ms",
                    "https://scripts.clarity.ms",
                    "https://www.googletagmanager.com",
                ].forEach(function (origin) {
                    // 일반 <script>로 받는 곳이라 crossorigin은 붙이지 않는다.
                    // 붙이면 실제로 쓰는 연결과 종류가 달라 미리 연 것이 버려진다
                    var hint = document.createElement("link");
                    hint.rel = "preconnect";
                    hint.href = origin;
                    document.head.appendChild(hint);
                });

                (function (c, l, a, r, i, t, y) {
                    c[a] =
                        c[a] ||
                        function () {
                            (c[a].q = c[a].q || []).push(arguments);
                        };
                    t = l.createElement(r);
                    t.async = 1;
                    t.src = "https://www.clarity.ms/tag/" + i;
                    y = l.getElementsByTagName(r)[0];
                    y.parentNode.insertBefore(t, y);
                })(window, document, "clarity", "script", "y7sd9jnhr5");

                var tag = document.createElement("script");
                tag.async = true;
                tag.src =
                    "https://www.googletagmanager.com/gtag/js?id=G-W5YN0E1QLR";
                document.head.appendChild(tag);

                window.dataLayer = window.dataLayer || [];
                window.gtag = function () {
                    window.dataLayer.push(arguments);
                };
                window.gtag("js", new Date());
                window.gtag("config", "G-W5YN0E1QLR");
            })();
        </script>

        <title>강하영 · 프론트엔드 개발자 포트폴리오</title>
        <meta
            name="description"
            content="화면이 기다리게 두지 않는 프론트엔드 개발자 강하영의 포트폴리오. TypeScript · React · Next.js로 만든 9개의 프로젝트와, 브라우저 안에서 도는 AI 질의응답."
        />
        <meta name="author" content="강하영" />

        <meta property="og:type" content="website" />
        <meta
            property="og:title"
            content="강하영 · 프론트엔드 개발자 포트폴리오"
        />
        <meta
            property="og:description"
            content="화면이 기다리게 두지 않는 프론트엔드 개발자. 서버 없이 브라우저에서 도는 AI에게 직접 물어보세요."
        />
        <meta property="og:locale" content="ko_KR" />
        <meta name="twitter:card" content="summary_large_image" />
    </head>
    <body style="background-color: #ffffff">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
